services:
  - type: web
    name: digital-gram-panchayat
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn digital_gram_panchayat.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"