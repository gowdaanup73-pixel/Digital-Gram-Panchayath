{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center">
                <span class="material-symbols-outlined mr-3 text-primary">add_circle</span>
                Create New Voting Session
            </h1>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                Set up a new voting session for an elected position
            </p>
        </div>

        <div class="bg-white dark:bg-gray-800 shadow-sm rounded-lg overflow-hidden">
            <form method="post" class="p-6 space-y-6">
                {% csrf_token %}
                
                <!-- Title -->
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Title
                    </label>
                    <input type="text" name="title" id="title" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm
                        focus:border-primary focus:ring-primary sm:text-sm
                        dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                        placeholder="Enter voting session title">
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Description
                    </label>
                    <textarea name="description" id="description" rows="4" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm
                        focus:border-primary focus:ring-primary sm:text-sm
                        dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                        placeholder="Provide details about this voting session"></textarea>
                </div>

                <!-- Position -->
                <div>
                    <label for="position" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Position
                    </label>
                    <select name="position" id="position" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm
                        focus:border-primary focus:ring-primary sm:text-sm
                        dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                        {% if positions %}
                        <option value="">Select a position</option>
                        {% for position in positions %}
                        <option value="{{ position.id }}">{{ position.name }} ({{ position.term_length }} year term)</option>
                        {% endfor %}
                        {% else %}
                        <option value="" disabled>No positions available. Create one first.</option>
                        {% endif %}
                    </select>
                </div>

                <!-- Dates -->
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                    <div>
                        <label for="start_date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            Start Date & Time
                        </label>
                        <input type="datetime-local" name="start_date" id="start_date" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm
                            focus:border-primary focus:ring-primary sm:text-sm
                            dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>

                    <div>
                        <label for="end_date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                            End Date & Time
                        </label>
                        <input type="datetime-local" name="end_date" id="end_date" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm
                            focus:border-primary focus:ring-primary sm:text-sm
                            dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end space-x-3 pt-6">
                    <a href="{% url 'manage_voting_sessions' %}"
                        class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm
                        font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2
                        focus:ring-offset-2 focus:ring-primary dark:bg-gray-700 dark:border-gray-600 dark:text-gray-300
                        dark:hover:bg-gray-600">
                        <span class="material-symbols-outlined mr-2">arrow_back</span>
                        Cancel
                    </a>
                    <button type="submit"
                        class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm
                        font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2
                        focus:ring-offset-2 focus:ring-primary">
                        <span class="material-symbols-outlined mr-2">save</span>
                        Create Session
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Set minimum date for start_date to today
    const today = new Date();
    const startDateInput = document.getElementById('start_date');
    const endDateInput = document.getElementById('end_date');
    
    // Format date to YYYY-MM-DDThh:mm
    const formatDate = (date) => {
        return date.toISOString().slice(0, 16);
    };
    
    startDateInput.min = formatDate(today);
    
    // Update end_date min when start_date changes
    startDateInput.addEventListener('change', function() {
        const startDate = new Date(this.value);
        endDateInput.min = formatDate(startDate);
        
        // If end_date is before new start_date, update it
        if (endDateInput.value && new Date(endDateInput.value) < startDate) {
            endDateInput.value = formatDate(startDate);
        }
    });
});
</script>
{% endblock %}
