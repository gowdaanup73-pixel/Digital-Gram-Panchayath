{% extends 'base.html' %}
{% block content %}
<div class="flex flex-col min-h-screen justify-center items-center px-4 bg-gray-50 dark:bg-gray-900">
<div class="w-full max-w-sm mx-auto">
<header class="text-center mb-8">
<h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Digital Gram Panchayat</h1>
<p class="mt-2 text-lg text-gray-600 dark:text-gray-400">Officer/Admin Portal</p>
</header>
<main class="space-y-6">
<div class="bg-white dark:bg-gray-800 shadow-sm rounded-xl p-6">
    <form method="post" autocomplete="off" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1">
            <label for="id_username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400">person</span>
                <input type="text" name="username" id="id_username" maxlength="150" required 
                    class="block w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
        </div>
        
        <div class="space-y-1">
            <label for="id_password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400">lock</span>
                <input type="password" name="password" id="id_password" required 
                    class="block w-full pl-10 pr-12 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white bg-white dark:bg-gray-700 focus:ring-2 focus:ring-primary focus:border-transparent">
                <button type="button" onclick="togglePassword()" 
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        {% if form.errors %}
        <div class="bg-red-50 dark:bg-red-900/50 text-red-600 dark:text-red-400 text-sm rounded-lg p-3">
            {% for error in form.non_field_errors %}
            <p>{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <button type="submit" 
            class="w-full flex items-center justify-center px-4 py-3 rounded-lg bg-primary text-white text-base font-semibold hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
            <span class="material-symbols-outlined mr-2">admin_panel_settings</span>
            Login as Officer/Admin
        </button>
    </form>
</div>
    <script>
    function togglePassword() {
        const input = document.getElementById('id_password');
        const icon = document.querySelector('button[onclick="togglePassword()"] .material-symbols-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    }
    </script>
</main>
<footer class="mt-8 text-center">
    <p class="text-sm text-gray-600 dark:text-gray-400">
        Not an officer? <a class="font-medium text-primary hover:underline" href="{% url 'login' %}">User Login</a>
    </p>
</footer>
</div>
</div>
{% endblock %}
