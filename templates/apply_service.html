{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <header class="sticky top-0 z-10 bg-white dark:bg-gray-800 shadow-sm">
        <div class="flex items-center justify-between p-4">
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">{{ service.name }}</h1>
            <a href="{% url 'services' %}" class="flex items-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="ml-1 text-sm">Back to Services</span>
            </a>
        </div>
    </header>

    <main class="p-4">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6 space-y-6">
                <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                    <p class="text-gray-600 dark:text-gray-400">{{ service.description }}</p>
                </div>

                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <div class="space-y-1">
                        <label for="id_full_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Full Name</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400">person</span>
                            <input type="text" name="full_name" id="id_full_name" required 
                                class="block w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label for="id_aadhar_number" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Aadhar Number</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400">badge</span>
                            <input type="text" name="aadhar_number" id="id_aadhar_number" required 
                                class="block w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label for="id_address" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Address</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-3 text-gray-500 dark:text-gray-400">home</span>
                            <textarea name="address" id="id_address" rows="3" required 
                                class="block w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full flex items-center justify-center px-4 py-3 rounded-lg bg-primary text-white text-base font-semibold hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                        <span class="material-symbols-outlined mr-2">send</span>
                        Submit Application
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
{% endblock %}
