{% extends 'base.html' %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center space-y-6 bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
        <span class="material-symbols-outlined text-green-500 text-5xl">mark_email_read</span>
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Email Sent</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400">
            If an account exists with the email you entered, we have sent instructions to reset your password.
        </p>
        <a href="{% url 'login' %}" class="inline-block px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:bg-primary/90">
            Return to Login
        </a>
    </div>
</div>
{% endblock %}
