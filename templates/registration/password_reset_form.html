{% extends 'base.html' %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
        <div>
            <h2 class="text-center text-3xl font-extrabold text-gray-900 dark:text-white">Reset Password</h2>
            <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
                Enter your account email to receive a password reset link.
            </p>
        </div>
        <form class="mt-8 space-y-6" method="POST">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email address</label>
                <input id="id_email" name="email" type="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:ring-primary focus:border-primary dark:bg-gray-700 dark:text-white sm:text-sm">
            </div>
            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Send Reset Link
                </button>
            </div>
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-sm text-primary hover:underline">Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
