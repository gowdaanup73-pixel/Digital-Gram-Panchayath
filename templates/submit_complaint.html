{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <header class="bg-white dark:bg-gray-800 shadow">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Submit Complaint</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 py-6 sm:px-0">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow px-5 py-6 sm:px-6">
                <form method="post" enctype="multipart/form-data" class="space-y-6">
                    {% csrf_token %}
                    
                    {% if messages %}
                    <div class="rounded-md bg-green-50 dark:bg-green-900/50 p-4 mb-6">
                        {% for message in messages %}
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <span class="material-symbols-outlined text-green-400">check_circle</span>
                            </div>
                            <div class="ml-3">
                                <p class="text-sm font-medium text-green-800 dark:text-green-200">
                                    {{ message }}
                                </p>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                        <div class="sm:col-span-3">
                            <label for="category" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Category
                            </label>
                            <select id="category" name="category" required
                                class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-gray-600 
                                focus:outline-none focus:ring-primary focus:border-primary sm:text-sm rounded-md
                                dark:bg-gray-700 dark:text-white">
                                <option value="">Select a category</option>
                                {% for value, label in categories %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="sm:col-span-6">
                            <label for="subject" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Subject
                            </label>
                            <input type="text" name="subject" id="subject" required
                                class="mt-1 block w-full border-gray-300 dark:border-gray-600 rounded-md shadow-sm
                                focus:ring-primary focus:border-primary sm:text-sm dark:bg-gray-700 dark:text-white">
                        </div>

                        <div class="sm:col-span-6">
                            <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Description
                            </label>
                            <textarea id="description" name="description" rows="4" required
                                class="mt-1 block w-full border border-gray-300 dark:border-gray-600 rounded-md shadow-sm
                                focus:ring-primary focus:border-primary sm:text-sm dark:bg-gray-700 dark:text-white"></textarea>
                        </div>

                        <div class="sm:col-span-6">
                            <label for="location" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Location
                            </label>
                            <input type="text" name="location" id="location" required
                                class="mt-1 block w-full border-gray-300 dark:border-gray-600 rounded-md shadow-sm
                                focus:ring-primary focus:border-primary sm:text-sm dark:bg-gray-700 dark:text-white">
                        </div>

                        <div class="sm:col-span-6">
                            <label for="attachment" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Attachment (optional)
                            </label>
                            <input type="file" name="attachment" id="attachment"
                                class="mt-1 block w-full text-sm text-gray-500 dark:text-gray-400
                                file:mr-4 file:py-2 file:px-4
                                file:rounded-md file:border-0
                                file:text-sm file:font-semibold
                                file:bg-primary file:text-white
                                hover:file:bg-primary/90">
                            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                                Upload any relevant images or documents (max 5MB)
                            </p>
                        </div>
                    </div>

                    <div class="pt-5">
                        <div class="flex justify-end">
                            <a href="{% url 'view_complaints' %}"
                                class="bg-white dark:bg-gray-700 py-2 px-4 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium
                                text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2
                                focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900">
                                Cancel
                            </a>
                            <button type="submit"
                                class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm
                                font-medium rounded-md text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2
                                focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900">
                                Submit Complaint
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
{% endblock %}
